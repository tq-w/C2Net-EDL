model:
  type: 'vit_base'
  patch_size: 16
  input_size: 256
  num_classes: 30
  finetune: 'https://dl.fbaipublicfiles.com/mae/pretrain/mae_pretrain_vit_base.pth'
  global_pool: true
  multi_task: true

data:
  root_dir: '/root/C2Net_EDL/data/ODIR_crop'
  csv_file: '/root/FINAL_CORRECTED_VERSION/train_labels_multilabel.csv'
  min_samples: 1

training:
  epochs: 100
  batch_size: 256
  num_workers: 8
  warmup_epochs: 5
  lr: 0.0001
  layer_decay: 0.65
  weight_decay: 0.05

edl:
  kl_annealing_epochs: 20
  uncertainty_gamma: 0.0

output_dir: 'outputs'
task: 'base_run_v3_improved'
amp: true
device: 'cuda'
