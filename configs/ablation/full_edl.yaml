# Full EDL Configuration
# Complete EDL with all components

model:
  type: vit_base
  num_classes: 20
  finetune: 'https://dl.fbaipublicfiles.com/mae/pretrain/mae_pretrain_vit_base.pth'

loss:
  loss_type: edl_beta
  alpha: [0.25] * 20
  gamma: [2.0] * 20
  pos_weight: [1.0] * 20

edl:
  kl_annealing_epochs: 20
  uncertainty_gamma: 2.0
  contra_weight: 0.1  # With contrastive loss
  evidence_activation: softplus
  evidence_scale: 10.0  # Evidence scaling
  neg_weight: 0.2  # Asymmetric weighting
  annealing_type: cyclical  # Cyclical annealing

training:
  epochs: 100
  batch_size: 32
  lr: 1e-4
  warmup_epochs: 10
  early_stop_patience: 15
  seed: 0

data:
  min_samples: 10
  merge_tail_classes: false
